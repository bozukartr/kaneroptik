<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaner Optik — Mağaza Yönetim Sistemi</title>
<meta name="description" content="Kaner Optik müşteri, reçete, satış ve stok yönetim uygulaması">
<meta name="theme-color" content="#0B3B43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F5F1;
    --paper-alt:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A0;
    --teal:#14555F;
    --teal-dark:#0E3E46;
    --teal-tint:#E6EEEE;
    --amber:#D68A3C;
    --amber-tint:#FBEDDB;
    --mist:#E4E7E6;
    --mist-dark:#D3D7D5;
    --success:#3F7A5C;
    --success-tint:#E4EFE8;
    --danger:#B3452C;
    --danger-tint:#F7E7E1;
    --radius-sm:6px;
    --radius:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(27,36,48,.06);
    --shadow:0 1px 2px rgba(27,36,48,.06), 0 6px 16px rgba(27,36,48,.05);
    --shadow-lg:0 4px 8px rgba(27,36,48,.06), 0 16px 40px rgba(27,36,48,.10);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sidebar-w:248px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:var(--teal);}
  ::selection{background:var(--amber-tint);}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--teal-dark);
    color:#EAF1F1;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px 8px;}
  .brand-mark{flex-shrink:0;}
  .brand-name{font-family:var(--font-display);font-size:21px;font-weight:700;color:#fff;letter-spacing:.2px;}
  .brand-tag{font-size:10.5px;color:#9FC1C1;letter-spacing:.5px;text-transform:uppercase;margin-top:1px;}

  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    background:transparent;border:none;
    color:#C9DCDC;
    padding:10px 12px;border-radius:var(--radius-sm);
    text-align:left;font-size:13.5px;font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:#EAF1F1;color:var(--teal-dark);}
  .nav-item.active svg{opacity:1;}
  .nav-item .count{
    margin-left:auto;font-size:11px;font-family:var(--font-mono);
    background:rgba(255,255,255,.12);padding:1px 6px;border-radius:20px;color:#DCEAEA;
  }
  .nav-item.active .count{background:var(--teal-tint);color:var(--teal-dark);}

  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);}
  .sidebar-footer-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#7FA3A3;margin-bottom:8px;padding:0 8px;}
  .sidebar-link{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
    color:#B9D3D3;padding:7px 8px;border-radius:var(--radius-sm);font-size:12.5px;text-align:left;
  }
  .sidebar-link:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar-link svg{opacity:.8;flex-shrink:0;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:18px 32px;background:rgba(246,245,241,.88);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--mist);
  }
  .topbar-title-wrap{display:flex;flex-direction:column;}
  #viewTitle{font-size:22px;}
  #viewSubtitle{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}

  .search-box{position:relative;}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .search-box input{
    width:250px;padding:9px 12px 9px 34px;border-radius:20px;border:1px solid var(--mist-dark);
    background:#fff;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .search-box input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);}

  .view-container{padding:26px 32px 60px 32px;flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
    font-weight:600;font-size:13px;white-space:nowrap;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{background:#BE7A2E;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--mist-dark);}
  .btn-ghost:hover{background:#fff;border-color:var(--ink-faint);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--danger);border-color:#E4C4B8;}
  .btn-danger:hover{background:var(--danger-tint);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-icon{padding:7px;border-radius:var(--radius-sm);background:transparent;border:1px solid transparent;color:var(--ink-soft);}
  .btn-icon:hover{background:var(--mist);color:var(--ink);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- Cards / stat cards ---------- */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:2fr 1fr;}
  .card{
    background:var(--paper-alt);border:1px solid var(--mist);border-radius:var(--radius-lg);
    padding:20px;
  }
  .card-title{font-size:15px;font-weight:600;font-family:var(--font-display);margin-bottom:2px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .card-head p{margin:2px 0 0 0;font-size:12px;color:var(--ink-soft);}

  .stat-card{
    background:var(--paper-alt);border:1px solid var(--mist);border-radius:var(--radius-lg);
    padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
  }
  .stat-icon{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--teal-tint);color:var(--teal);
  }
  .stat-label{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .stat-value{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
  .stat-sub{font-size:11.5px;color:var(--ink-faint);}
  .stat-sub.warn{color:var(--danger);}
  .stat-sub.good{color:var(--success);}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.2px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--ink-faint);font-weight:600;padding:0 14px 10px 14px;border-bottom:1px solid var(--mist);
    white-space:nowrap;
  }
  tbody td{padding:13px 14px;border-bottom:1px solid var(--mist);vertical-align:middle;}
  tbody tr{transition:background .12s ease;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--teal-tint);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-strong{font-weight:600;color:var(--ink);}
  .cell-muted{color:var(--ink-soft);}
  .cell-mono{font-family:var(--font-mono);font-size:12.5px;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    font-size:11.5px;font-weight:600;
  }
  .badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-success{background:var(--success-tint);color:var(--success);}
  .badge-warn{background:var(--amber-tint);color:#95611F;}
  .badge-danger{background:var(--danger-tint);color:var(--danger);}
  .badge-neutral{background:var(--mist);color:var(--ink-soft);}

  .empty-state{
    text-align:center;padding:52px 20px;color:var(--ink-soft);
  }
  .empty-state svg{color:var(--mist-dark);margin-bottom:14px;}
  .empty-state h3{font-size:16px;margin-bottom:5px;color:var(--ink);}
  .empty-state p{font-size:12.8px;margin:0 0 16px 0;}

  /* ---------- Forms ---------- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field .hint{font-size:11px;color:var(--ink-faint);font-weight:400;}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--mist-dark);border-radius:var(--radius-sm);
    background:#fff;outline:none;width:100%;transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;}
  /* Diopter grid stays multi-column on phones; values are only a few characters wide. */
  .rx-eye-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  fieldset{border:1px solid var(--mist);border-radius:var(--radius);padding:14px 16px 4px 16px;margin-bottom:16px;}
  legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--teal);padding:0 6px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,27,31,.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:5vh 20px;overflow-y:auto;z-index:100;
  }
  .modal-overlay.open{display:flex;}
  /* Scroll lock: position:fixed rather than overflow:hidden, which iOS Safari ignores on body. */
  body.scroll-locked{position:fixed;left:0;right:0;width:100%;overflow:hidden;}
  .modal{
    background:var(--paper-alt);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
    width:100%;max-width:560px;animation:modalIn .16s ease;
  }
  .modal.modal-wide{max-width:760px;}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--mist);}
  .modal-header h3{font-size:17px;}
  .modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--mist);}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--mist);margin-bottom:20px;}
  .tab{
    padding:10px 4px;margin-right:22px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--ink-soft);font-weight:600;font-size:13px;margin-bottom:-1px;
  }
  .tab.active{color:var(--teal);border-color:var(--teal);}

  /* ---------- Toast ---------- */
  .toast-container{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);
    font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;
    animation:toastIn .18s ease;
  }
  .toast.success{background:var(--success);}
  .toast.error{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- Lens diagram (signature element) ---------- */
  .lens-diagram-label{font-family:var(--font-mono);}
  .lens-preview-cell{display:flex;align-items:center;}

  /* ---------- Detail / customer page ---------- */
  .detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;}
  .detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12.5px;font-weight:600;margin-bottom:14px;background:none;border:none;}
  .detail-back:hover{color:var(--teal);}
  .avatar-circle{
    width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px;font-weight:600;flex-shrink:0;
  }
  .detail-title-row{display:flex;gap:14px;align-items:center;}
  .detail-meta-row{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap;}
  .detail-meta-item{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .detail-meta-item svg{color:var(--ink-faint);}

  .subcard{border:1px solid var(--mist);border-radius:var(--radius);padding:16px 18px;background:#fff;margin-bottom:12px;}
  .subcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .subcard-head .when{font-size:11.5px;color:var(--ink-faint);}

  /* ---------- Chart bars ---------- */
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .bar{width:100%;max-width:34px;background:var(--teal);border-radius:5px 5px 0 0;transition:background .15s;position:relative;}
  .bar:hover{background:var(--amber);}
  .bar-col .bar-label{font-size:10.5px;color:var(--ink-soft);}
  .bar-col .bar-value{font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);}

  .donut-wrap{display:flex;align-items:center;gap:22px;}
  .legend-list{display:flex;flex-direction:column;gap:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .legend-swatch{width:10px;height:10px;border-radius:3px;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .hbar-label{width:110px;font-size:12px;color:var(--ink-soft);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;height:9px;background:var(--mist);border-radius:6px;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--teal);border-radius:6px;}
  .hbar-val{width:70px;text-align:right;font-size:12px;font-family:var(--font-mono);color:var(--ink-soft);flex-shrink:0;}

  .detail-meta-link{text-decoration:none;color:var(--ink-soft);}
  .detail-meta-link:hover{color:var(--teal);text-decoration:underline;}
  .list-row-btn{width:100%;background:none;border:0;padding:6px 4px;border-radius:var(--radius-sm);color:inherit;font:inherit;gap:10px;}
  .list-row-btn:hover{background:var(--paper);}
  .hbar-label-btn{background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink-soft);}
  .hbar-label-btn:hover{color:var(--teal);}

  .divider{height:1px;background:var(--mist);margin:18px 0;}
  .muted{color:var(--ink-soft);}
  .text-right{text-align:right;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;}
  .stack-8{display:flex;flex-direction:column;gap:8px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--mist-dark);font-size:12px;font-weight:600;color:var(--ink-soft);background:#fff;}
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .kbd-hint{font-size:11px;color:var(--ink-faint);}

  @media (max-width:1080px){
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:1fr;}
  }
  @media (max-width:900px), (max-width:1024px) and (orientation:landscape) and (hover:none){
    .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg);}
    .sidebar.open{transform:none;}
    .main{width:100%;}
    .topbar{padding:14px 16px;}
    .view-container{padding:18px 16px 60px 16px;}
    .search-box input{width:150px;}
    .grid-4{grid-template-columns:1fr 1fr;}
    .form-row,.form-row-3,.form-row-4{grid-template-columns:1fr;}
  }

  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  /* =====================================================
     v1.1 professional upgrade — new component styles
     ===================================================== */

  /* ---------- Refined stat cards / trend ---------- */
  .stat-card{transition:box-shadow .15s ease, transform .15s ease;}
  .stat-card:hover{box-shadow:var(--shadow);}
  .stat-trend{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 7px 1px 5px;border-radius:20px;}
  .stat-trend.up{color:var(--success);background:var(--success-tint);}
  .stat-trend.down{color:var(--danger);background:var(--danger-tint);}
  .stat-trend.flat{color:var(--ink-soft);background:var(--mist);}

  /* ---------- Topbar extras: cmdk hint, bell, workspace ---------- */
  .cmdk-hint-btn{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;
    border:1px solid var(--mist-dark);background:#fff;color:var(--ink-soft);font-size:12px;font-weight:500;
  }
  .cmdk-hint-btn:hover{border-color:var(--ink-faint);color:var(--ink);}
  .cmdk-hint-btn kbd{
    font-family:var(--font-mono);font-size:10.5px;background:var(--mist);padding:1px 5px;border-radius:4px;color:var(--ink-soft);
  }
  .icon-btn-wrap{position:relative;}
  .bell-btn{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;border:1px solid var(--mist-dark);background:#fff;color:var(--ink-soft);
  }
  .bell-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
  .bell-badge{
    position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:20px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--paper);
  }
  .dropdown-panel{
    position:absolute;top:46px;right:0;width:340px;background:#fff;border:1px solid var(--mist-dark);
    border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;
  }
  .dropdown-header{padding:12px 16px;border-bottom:1px solid var(--mist);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .dropdown-list{max-height:340px;overflow-y:auto;}
  .alert-item{
    display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--mist);
    background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;cursor:pointer;
  }
  .alert-item:hover{background:var(--paper);}
  .alert-item:last-child{border-bottom:none;}
  .alert-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .alert-icon.warn{background:var(--amber-tint);color:#95611F;}
  .alert-icon.danger{background:var(--danger-tint);color:var(--danger);}
  .alert-icon.info{background:var(--teal-tint);color:var(--teal);}
  .alert-text{font-size:12.5px;line-height:1.4;}
  .alert-text strong{display:block;font-size:12.8px;margin-bottom:1px;}
  .workspace-pill{
    display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;border:1px solid var(--mist-dark);background:#fff;
  }
  .workspace-pill:hover{border-color:var(--ink-faint);}
  .workspace-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:var(--font-display);overflow:hidden;flex-shrink:0;
  }
  .workspace-avatar img{width:100%;height:100%;object-fit:cover;}
  .workspace-pill-name{font-size:12.5px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- Command palette ---------- */
  .cmdk-overlay{
    position:fixed;inset:0;background:rgba(20,27,31,.5);display:none;align-items:flex-start;justify-content:center;
    padding:12vh 20px 20px 20px;z-index:150;
  }
  .cmdk-overlay.open{display:flex;}
  .cmdk-box{
    width:100%;max-width:560px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;
    animation:modalIn .14s ease;
  }
  .cmdk-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--mist);}
  .cmdk-input-row svg{color:var(--ink-faint);flex-shrink:0;}

    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);width:100%;background:none;border:none;text-align:left;font-size:13.5px;

  .tag-Kurumsal{background:var(--mist);color:var(--ink-soft);}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}

  /* ---------- Sortable table headers ---------- */
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink-soft);}
  th.sortable .sort-arrow{display:inline-block;margin-left:3px;opacity:.35;font-size:9px;}
  th.sortable.sorted .sort-arrow{opacity:1;color:var(--teal);}

  /* ---------- Pagination ---------- */
  .pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--mist);font-size:12.5px;color:var(--ink-soft);}

  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--mist);}

<script>
"use strict";

/* =========================================================
   NETLIK — Optik Yönetim Sistemi
   Saf HTML / CSS / JS. Veriler tarayıcıda localStorage'da tutulur.
   ========================================================= */

const DB_KEY = "kaneroptik_db_v2";
let DB = null;

const PRODUCT_CATEGORIES = ["Çerçeve", "Güneş Gözlüğü", "Lens (Cam)", "Kontakt Lens", "Aksesuar"];
const RX_TYPES = ["Uzak", "Yakın", "Progresif", "Bifokal", "Kontakt Lens"];
const PAYMENT_METHODS = ["Nakit", "Kredi Kartı", "Havale/EFT", "Diğer"];
const CUSTOMER_TAGS = ["VIP", "Çocuk", "Progresif", "Yeni", "Kurumsal"];
const KDV_ORANLARI = [20, 10, 1, 0];
const RX_RENEWAL_DAYS = 365;

function defaultSettings(){
  return {
    magazaAdi: "Kaner Optik",
    logo: "",
    adres: "",
    telefon: "",
    vergiDairesi: "",
    vergiNo: "",
    kdvOrani: 20,
    faturaOnEk: "NTL-",
    faturaSonNo: 0,
    fisNotu: "Bizi tercih ettiğiniz için teşekkür ederiz.",
  };
}

/* ---------------- Storage ---------------- */
function emptyDB(){
  return { customers: [], prescriptions: [], sales: [], products: [], settings: defaultSettings() };
}

function migrateDB(db){
  if(!db.settings) db.settings = defaultSettings();
  else db.settings = Object.assign(defaultSettings(), db.settings);

  db.customers.forEach(c=>{ if(!Array.isArray(c.etiketler)) c.etiketler = []; });

  // Backfill invoice numbers for sales created before invoicing existed,
  // in chronological order so numbering stays sequential.
  const needsNumbering = db.sales.filter(s=>!s.faturaNo);
  if(needsNumbering.length){
    needsNumbering.sort((a,b)=> (a.tarih||"").localeCompare(b.tarih||""));
    needsNumbering.forEach(s=>{
      db.settings.faturaSonNo += 1;
      s.faturaNo = db.settings.faturaOnEk + String(db.settings.faturaSonNo).padStart(5,"0");
    });
  }
  db.sales.forEach(s=>{ if(s.kdvOrani===undefined || s.kdvOrani===null) s.kdvOrani = db.settings.kdvOrani; });
  return db;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY) || localStorage.getItem("netlik_db_v1");
    if(raw) return migrateDB(JSON.parse(raw));
  }catch(e){ console.error("DB okunamadı:", e); }
  return null;
}

function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){
    console.error("DB kaydedilemedi:", e);
    showToast("Veriler kaydedilirken bir sorun oluştu.", "error");
  }
  updateNavCounts();
  updateSidebarBrand();
  refreshBellBadge();
  if(!window.__KANER_CLOUD_APPLYING__){
    window.dispatchEvent(new CustomEvent("kaner:db-changed", {detail: JSON.parse(JSON.stringify(DB))}));
  }
}

function uid(prefix){
  return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function nextInvoiceNumber(){
  DB.settings.faturaSonNo += 1;
  return DB.settings.faturaOnEk + String(DB.settings.faturaSonNo).padStart(5,"0");
}

/* ---------------- Formatting helpers ---------------- */
function fmtCurrency(n){
  n = Number(n)||0;
  return n.toLocaleString("tr-TR", {style:"currency", currency:"TRY", maximumFractionDigits:0});
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("tr-TR", {day:"2-digit", month:"short", year:"numeric"});
}
function fmtDateInput(iso){
  if(!iso) return "";
  return iso.slice(0,10);
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function daysSince(iso){
  if(!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function fmtDiopter(v){
  if(v===""||v===null||v===undefined||isNaN(v)) return "—";
  const n = parseFloat(v);
  if(n===0) return "0.00";
  return (n>0?"+":"") + n.toFixed(2);
}
function fmtAdd(v){
  if(v===""||v===null||v===undefined||isNaN(v)||parseFloat(v)===0) return null;
  return "+"+parseFloat(v).toFixed(2);
}
function escapeHTML(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function initials(a,b){
  return ((a||"?").trim()[0]||"?").toUpperCase() + ((b||"").trim()[0]||"").toUpperCase();
}
function tagBadge(tag){
  return `<span class="tag-badge tag-${tag.replace(/\s/g,'')}">${escapeHTML(tag)}</span>`;
}
function formatPhoneMask(value){
  const digits = value.replace(/\D/g,"").slice(0,11);
  const parts = [];
  if(digits.length<=4) return digits;
  parts.push(digits.slice(0,4));
  if(digits.length>4) parts.push(digits.slice(4,7));
  if(digits.length>7) parts.push(digits.slice(7,9));
  if(digits.length>9) parts.push(digits.slice(9,11));
  return parts.filter(Boolean).join(" ");
}
function taxBreakdown(total, rate){
  total = Number(total)||0;
  rate = Number(rate)||0;
  const kdv = rate>0 ? total - (total/(1+rate/100)) : 0;
  return { araToplam: total-kdv, kdv, genelToplam: total };
}

/* ---------------- CSV export ---------------- */
function toCSV(headers, rows){
  const esc = v => {
    v = v===undefined||v===null ? "" : String(v);
    if(/[",;\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  return [headers.map(esc).join(";")].concat(rows.map(r=>r.map(esc).join(";"))).join("\r\n");
}
function downloadCSV(filename, headers, rows){
  const csv = "\uFEFF" + toCSV(headers, rows);
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast("CSV dosyası indirildi.", "success");
}

/* ---------------- Generic sort / paginate ---------------- */
function sortRows(rows, key, dir, accessor){
  const sorted = rows.slice().sort((a,b)=>{
    let va = accessor(a,key), vb = accessor(b,key);
    if(typeof va === "string") va = va.toLowerCase();
    if(typeof vb === "string") vb = vb.toLowerCase();
    if(va<vb) return dir==="asc"?-1:1;
    if(va>vb) return dir==="asc"?1:-1;
    return 0;
  });
  return sorted;
}
function sortArrow(colKey, state){
  if(state.key!==colKey) return `<span class="sort-arrow">▲</span>`;
  return `<span class="sort-arrow">${state.dir==="asc"?"▲":"▼"}</span>`;
}
function paginateSlice(rows, page, perPage){
  const start = (page-1)*perPage;
  return rows.slice(start, start+perPage);
}
function paginationBar(totalItems, page, perPage, groupId){
  const totalPages = Math.max(1, Math.ceil(totalItems/perPage));
  page = Math.min(page, totalPages);
  let btns = "";
  const windowSize = 5;
  let start = Math.max(1, page-Math.floor(windowSize/2));
  let end = Math.min(totalPages, start+windowSize-1);
  start = Math.max(1, end-windowSize+1);
  for(let i=start;i<=end;i++){
    btns += `<button class="page-btn ${i===page?'active':''}" data-page-group="${groupId}" data-page="${i}">${i}</button>`;
  }
  return `
    <div class="pagination-bar">
      <span>${totalItems} kayıttan ${totalItems===0?0:((page-1)*perPage+1)}–${Math.min(page*perPage,totalItems)} arası gösteriliyor</span>
      <div class="pagination-controls">
        <button class="page-btn" data-page-group="${groupId}" data-page="${page-1}" ${page<=1?"disabled":""}>‹</button>
        ${btns}
        <button class="page-btn" data-page-group="${groupId}" data-page="${page+1}" ${page>=totalPages?"disabled":""}>›</button>
      </div>
    </div>
  `;
}

/* ---------------- Scroll lock ---------------- */
/* Shared by the modal and the mobile quick sheet so overlays never let the page
   behind them scroll away underneath the user's finger. */
let scrollLockDepth = 0;
let scrollLockOffset = 0;
function lockBodyScroll(lock){
  if(lock){
    if(scrollLockDepth++ > 0) return;
    scrollLockOffset = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = `-${scrollLockOffset}px`;
    document.body.classList.add("scroll-locked");
  } else {
    if(scrollLockDepth === 0) return;
    if(--scrollLockDepth > 0) return;
    document.body.classList.remove("scroll-locked");
    document.body.style.top = "";
    window.scrollTo(0, scrollLockOffset);
  }
}

function isTouchLayout(){
  return window.matchMedia("(max-width:900px), (max-width:1024px) and (orientation:landscape) and (hover:none)").matches;
}

/* ---------------- Modal ---------------- */
function openModal(html, opts){
  opts = opts || {};
  const overlay = document.getElementById("modalOverlay");
  const box = document.getElementById("modalBox");
  box.className = "modal" + (opts.wide ? " modal-wide" : "");
  box.innerHTML = html;
  const wasOpen = overlay.classList.contains("open");
  overlay.classList.add("open");
  if(!wasOpen) lockBodyScroll(true);
  overlay.scrollTop = 0;
  // Autofocus pops the on-screen keyboard (or a select wheel) the instant a sheet
  // slides up, so it is reserved for pointer layouts.
  if(!isTouchLayout()){
    const first = box.querySelector("input,select,textarea");
    if(first) setTimeout(()=>first.focus(), 30);
  }
}
function closeModal(){
  const overlay = document.getElementById("modalOverlay");
  if(!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  document.getElementById("modalBox").innerHTML = "";
  lockBodyScroll(false);
}
/* Scoped to the modal: a document-wide query also grabs [data-close] buttons
   left behind elsewhere in the view. */
function bindModalClose(){
  document.getElementById("modalBox")
    .querySelectorAll("[data-close]")
    .forEach(b=> b.addEventListener("click", closeModal));
}
document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "modalOverlay") closeModal();
});

/* ---------------- Notifications / alerts ---------------- */
function computeAlerts(){
  const alerts = [];
  const pendingSales = DB.sales.filter(s=> saleStatus(s)!=="odendi");
  if(pendingSales.length){
    const amount = pendingSales.reduce((sum,s)=> sum+(saleTotal(s)-(Number(s.odenen)||0)),0);
    alerts.push({
      type:"danger",
      title: pendingSales.length+" bekleyen ödeme",
      text: fmtCurrency(amount)+" tahsil edilmeyi bekliyor",
      onClick: ()=>{ salesStatusFilter="all"; navigate("sales"); }
    });
  }
  const lowStock = DB.products.filter(p=>(Number(p.stok)||0)<=3);
  if(lowStock.length){
    alerts.push({
      type:"warn",
      title: lowStock.length+" ürün kritik stokta",
      text: lowStock.slice(0,3).map(p=>p.marka+" "+p.model).join(", ") + (lowStock.length>3?" ve diğerleri":""),
      onClick: ()=> navigate("inventory")
    });
  }
  const renewals = [];
  DB.customers.forEach(c=>{
    const rx = customerPrescriptions(c.id)[0];
    if(rx && daysSince(rx.tarih) >= RX_RENEWAL_DAYS) renewals.push(c);
  });
  renewals.slice(0,5).forEach(c=>{
    alerts.push({
      type:"info",
      title: "Reçete yenileme zamanı",
      text: customerFullName(c)+" için son reçete 1 yıldan eski",
      onClick: ()=> navigate("customerDetail", {id:c.id})
    });
  });
  return alerts;
}

  if(!badge) return;
  if(count>0){ badge.style.display="flex"; badge.textContent = count>9?"9+":count; }
  else badge.style.display="none";
}

function renderCmdkResults(query){
  const q = query.trim().toLowerCase();
  const { nav, actions } = cmdkStaticItems();
  const customerMatches = q ? DB.customers.filter(c=> customerFullName(c).toLowerCase().includes(q)).slice(0,5) : [];
  const filteredNav = nav.filter(i=> i.label.toLowerCase().includes(q));

    label:customerFullName(c), icon:"user", sub:c.telefon||"", action:()=>navigate("customerDetail",{id:c.id})
  }))];

  let html = "";
  if(filteredNav.length){
    html += `<div class="cmdk-group-label">Sayfalar</div>`;
    filteredNav.forEach(item=>{ html += cmdkItemHTML(item, idx===cmdkIndex, idx); idx++; });
  }
  if(filteredActions.length){
    html += `<div class="cmdk-group-label">Hızlı İşlemler</div>`;
    filteredActions.forEach(item=>{ html += cmdkItemHTML(item, idx===cmdkIndex, idx); idx++; });

  document.querySelectorAll(".cmdk-item").forEach(el=>{

  return `<button class="cmdk-item ${active?'active':''}" data-idx="${idx}">
    ${cmdkIconSVG(item.icon)}<span>${escapeHTML(item.label)}</span>
    ${item.sub?`<span class="cmdk-sub">${escapeHTML(item.sub)}</span>`:""}

  if(e.target.id==="cmdkOverlay") closeCmdk();
});
document.addEventListener("keydown",(e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){
    e.preventDefault();
    const overlay = document.getElementById("cmdkOverlay");
    overlay.classList.contains("open") ? closeCmdk() : openCmdk();
    return;
  }
  const overlay = document.getElementById("cmdkOverlay");
  if(!overlay.classList.contains("open")) return;
  if(e.key==="Escape"){ closeCmdk(); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); cmdkIndex = Math.min(cmdkIndex+1, cmdkFlatItems.length-1); renderCmdkResults(document.getElementById("cmdkInput").value); }
  if(e.key==="ArrowUp"){ e.preventDefault(); cmdkIndex = Math.max(cmdkIndex-1, 0); renderCmdkResults(document.getElementById("cmdkInput").value); }
  if(e.key==="Enter"){
    e.preventDefault();
    const item = cmdkFlatItems[cmdkIndex];
    if(item){ closeCmdk(); item.action(); }
  }
});

    try{
      const data = JSON.parse(reader.result);
      if(!data.customers || !data.prescriptions || !data.sales || !data.products){
        throw new Error("format");
      }
      DB = migrateDB(data);
      saveDB();
      showToast("Yedek başarıyla yüklendi.", "success");
      navigate("dashboard");
    }catch(err){
      showToast("Dosya okunamadı. Geçerli bir Kaner Optik yedeği seçin.", "error");
    }
  };
  reader.readAsText(file);
}

function trendBadge(current, previous){
  if(previous<=0){
    if(current<=0) return `<span class="stat-trend flat">—</span>`;
    return `<span class="stat-trend up">▲ yeni</span>`;
  }
  const pct = Math.round(((current-previous)/previous)*100);
  if(pct===0) return `<span class="stat-trend flat">%0</span>`;
  if(pct>0) return `<span class="stat-trend up">▲ %${pct}</span>`;
  return `<span class="stat-trend down">▼ %${Math.abs(pct)}</span>`;
}

function monthlyRevenueChart(months){
  const now = new Date();
  const keys = [];
  for(let i=months-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push({key: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label: d.toLocaleDateString("tr-TR",{month:"short"})});
  }
  const values = keys.map(k => DB.sales.filter(s=>(s.tarih||"").slice(0,7)===k.key).reduce((sum,s)=>sum+saleTotal(s),0));
  const max = Math.max(...values, 1);
  return `<div class="bar-chart">
    ${keys.map((k,i)=>`
      <div class="bar-col">
        <div class="bar-value">${values[i]>0 ? Math.round(values[i]/1000)+'b' : ''}</div>
        <div class="bar" style="height:${Math.max(4,(values[i]/max)*110)}px;" title="${fmtCurrency(values[i])}"></div>
        <div class="bar-label">${k.label}</div>
      </div>
    `).join("")}
  </div>`;
}

function openCustomerForm(customer){
  const isEdit = !!customer;
  let selectedTags = isEdit ? (customer.etiketler||[]).slice() : [];
  openModal(`
    <div class="modal-header"><h3>${isEdit?"Müşteriyi Düzenle":"Yeni Müşteri"}</h3><button class="btn-icon" data-close>✕</button></div>
    <div class="modal-body">${customerFormHTML(customer)}</div>

      <button class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" id="saveCustomerBtn">${isEdit?"Kaydet":"Müşteriyi Ekle"}</button>
    </div>
  `);
  bindModalClose();
  const phoneInput = document.getElementById("f_telefon");
  phoneInput.addEventListener("input", (e)=>{
    const pos = e.target.selectionStart;
    const before = e.target.value.length;
    e.target.value = formatPhoneMask(e.target.value);
    const after = e.target.value.length;
    e.target.setSelectionRange(pos+(after-before), pos+(after-before));
  });
  document.querySelectorAll("#customerTagChips .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const t = chip.dataset.tag;
      if(selectedTags.includes(t)){ selectedTags = selectedTags.filter(x=>x!==t); chip.classList.remove("active"); }
      else { selectedTags.push(t); chip.classList.add("active"); }

function deleteCustomer(id){
  const rxCount = DB.prescriptions.filter(r=>r.customerId===id).length;
  const saleCount = DB.sales.filter(s=>s.customerId===id).length;
  let msg = "Bu müşteri kalıcı olarak silinecek.";
  if(rxCount || saleCount) msg += ` Bağlı ${rxCount} reçete ve ${saleCount} satış kaydı da silinecektir.`;
  confirmAction(msg, ()=>{
    DB.customers = DB.customers.filter(c=>c.id!==id);
    DB.prescriptions = DB.prescriptions.filter(r=>r.customerId!==id);
    DB.sales = DB.sales.filter(s=>s.customerId!==id);
    saveDB();
    showToast("Müşteri silindi.");
    if(currentView==="customerDetail" && currentParams.id===id) navigate("customers"); else render();
  });

function preserveFocus(input){
  // Keep caret at end after re-render triggered by input event
  const val = input.value;
  requestAnimationFrame(()=>{
    const el = document.getElementById(input.id);
    if(el){ el.focus(); el.setSelectionRange(val.length, val.length); }
  });
}

/* Filter boxes re-render the whole view, which throws away the input element the
   user is typing into. Doing that per keystroke tears down the on-screen keyboard's
   composition state on mobile, so coalesce a burst of keystrokes into one render
   and only restore focus when the field actually had it. */
function bindFilterInput(input, apply, delay){
  let timer;
  input.addEventListener("input", (event)=>{
    const value = event.target.value;
    clearTimeout(timer);
    timer = setTimeout(()=>{
      const wasFocused = document.activeElement === input;
      apply(value);
      render();
      if(wasFocused) preserveFocus(input);
    }, delay === undefined ? 220 : delay);
  });
}

/* =========================================================
   LENS DIAGRAM — signature visual element
   Draws a simplified front-view of glasses with each lens
   annotated, and the astigmatism axis line drawn at the
   correct angle when a cylinder value is present.
   ========================================================= */
function lensDiagramSVG(rx, w, h, opts){
  opts = opts || {};
  w = w || 220; h = h || 100;
  const r = h*0.42;
  const cy = h/2;
  const cx1 = w*0.28, cx2 = w*0.72;
  const showLabels = opts.showLabels !== false;

  function axisLine(cx, cyl, axis){
    if(!cyl || Number(cyl)===0) return "";
    const rad = (Number(axis)||0) * Math.PI/180;
    const dx = r*0.82*Math.cos(rad), dy = -r*0.82*Math.sin(rad);
    return `<line x1="${cx-dx}" y1="${cy-dy}" x2="${cx+dx}" y2="${cy+dy}" stroke="var(--amber,#D68A3C)" stroke-width="2" stroke-linecap="round"/>`;
  }

  return `
  <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex-shrink:0;">
    <line x1="${cx1+r}" y1="${cy}" x2="${cx2-r}" y2="${cy}" stroke="var(--teal,#14555F)" stroke-width="2.4"/>
    <line x1="${cx1-r}" y1="${cy}" x2="${cx1-r-14}" y2="${cy-6}" stroke="var(--teal,#14555F)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="${cx2+r}" y1="${cy}" x2="${cx2+r+14}" y2="${cy-6}" stroke="var(--teal,#14555F)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${cx1}" cy="${cy}" r="${r}" fill="var(--teal-tint,#E6EEEE)" stroke="var(--teal,#14555F)" stroke-width="2.4"/>
    <circle cx="${cx2}" cy="${cy}" r="${r}" fill="var(--teal-tint,#E6EEEE)" stroke="var(--teal,#14555F)" stroke-width="2.4"/>
    ${axisLine(cx1, rx.od && rx.od.cyl, rx.od && rx.od.axis)}
    ${axisLine(cx2, rx.os && rx.os.cyl, rx.os && rx.os.axis)}
    ${showLabels ? `
    <text x="${cx1}" y="${h-4}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft,#5B6472)" font-family="Inter,sans-serif" font-weight="600">OD</text>
    <text x="${cx2}" y="${h-4}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft,#5B6472)" font-family="Inter,sans-serif" font-weight="600">OS</text>
    ` : ""}
  </svg>`;
}

                <tr><td class="cell-strong">OD</td><td class="cell-mono">${fmtDiopter(rx.od.sph)}</td><td class="cell-mono">${fmtDiopter(rx.od.cyl)}</td><td class="cell-mono">${rx.od.cyl?rx.od.axis+'°':'—'}</td><td class="cell-mono">${fmtAdd(rx.od.add)||'—'}</td></tr>
                <tr><td class="cell-strong">OS</td><td class="cell-mono">${fmtDiopter(rx.os.sph)}</td><td class="cell-mono">${fmtDiopter(rx.os.cyl)}</td><td class="cell-mono">${rx.os.cyl?rx.os.axis+'°':'—'}</td><td class="cell-mono">${fmtAdd(rx.os.add)||'—'}</td></tr>

        </div>`;
      }).join("") + `<div class="card" style="padding:0;">${paginationBar(total, rxPage, RX_PER_PAGE, "rx")}</div>`}
  `;
}

function openRxForm(rx, presetCustomerId){
  const isEdit = !!rx;
  const data = rx || {customerId:presetCustomerId||"", tarih:todayISO(), doktor:"", tur:"Uzak", od:{}, os:{}, pd:"", notlar:""};
  openModal(`
    <div class="modal-header"><h3>${isEdit?"Reçeteyi Düzenle":"Yeni Reçete"}</h3><button class="btn-icon" data-close>✕</button></div>
    <div class="modal-body">
      <div class="rx-customer-picker">
        <div class="field" style="margin-bottom:0;">
          <label>Müşteri *</label>
          <div class="rx-customer-select-row">
            ${customerSelectHTML(data.customerId)}
            <button class="btn btn-ghost" type="button" id="toggleRxQuickCustomer" aria-expanded="${DB.customers.length===0?'true':'false'}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Yeni müşteri
            </button>
          </div>
        </div>
        <div class="rx-quick-customer ${DB.customers.length===0?'open':''}" id="rxQuickCustomerPanel" aria-hidden="${DB.customers.length===0?'false':'true'}">
          <div class="rx-quick-customer-head">
            <div><strong>Hızlı müşteri oluştur</strong><span>Reçete bilgileri korunur ve yeni müşteri otomatik seçilir.</span></div>
            <span class="badge badge-neutral">Reçete içinde</span>
          </div>
          <div class="form-row">
            <div class="field"><label>Ad *</label><input id="f_rxq_ad" autocomplete="given-name" placeholder="Ad"></div>
            <div class="field"><label>Soyad *</label><input id="f_rxq_soyad" autocomplete="family-name" placeholder="Soyad"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Telefon *</label><input id="f_rxq_telefon" inputmode="tel" autocomplete="tel" placeholder="05XX XXX XX XX"></div>
            <div class="field"><label>E-posta</label><input id="f_rxq_email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@email.com"></div>
          </div>
          <div class="rx-quick-customer-actions ${DB.customers.length?'':'single'}">
            ${DB.customers.length ? '<button class="btn btn-ghost btn-sm" type="button" id="cancelRxQuickCustomer">Vazgeç</button>' : ''}
            <button class="btn btn-primary btn-sm" type="button" id="saveRxQuickCustomer">Müşteriyi oluştur ve seç</button>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>Tarih *</label><input type="date" id="f_rx_tarih" value="${fmtDateInput(data.tarih)||todayISO()}"></div>
        <div class="field"><label>Doktor</label><input id="f_rx_doktor" value="${escapeHTML(data.doktor)}" placeholder="Dr. Adı Soyadı"></div>
      </div>
      <div class="field">
        <label>Reçete Türü</label>
        <div class="chip-select" id="rxTypeChips">
          ${RX_TYPES.map(t=>`<button type="button" class="chip ${data.tur===t?'active':''}" data-type="${t}">${t}</button>`).join("")}
        </div>
      </div>
      <div id="rxLivePreview" style="display:flex;justify-content:center;margin:14px 0;">${lensDiagramSVG(data,240,110)}</div>
      ${rxEyeFieldsHTML("f_od","OD — Sağ Göz", data.od)}
      ${rxEyeFieldsHTML("f_os","OS — Sol Göz", data.os)}
      <div class="form-row">
        <div class="field"><label>PD (mm)</label><input type="number" step="0.5" id="f_rx_pd" value="${data.pd||''}"></div>
        <div class="field"><label>Not</label><input id="f_rx_notlar" value="${escapeHTML(data.notlar)}"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" id="saveRxBtn">${isEdit?"Kaydet":"Reçeteyi Ekle"}</button>
    </div>
  `, {wide:true});

  let selectedType = data.tur;
  bindModalClose();
  const quickCustomerPanel = document.getElementById("rxQuickCustomerPanel");
  const quickCustomerToggle = document.getElementById("toggleRxQuickCustomer");
  function setQuickCustomerOpen(open){
    quickCustomerPanel.classList.toggle("open", open);
    quickCustomerPanel.setAttribute("aria-hidden", String(!open));
    quickCustomerToggle.setAttribute("aria-expanded", String(open));
    if(open) setTimeout(()=>document.getElementById("f_rxq_ad").focus(), 120);
  }
  quickCustomerToggle.addEventListener("click", ()=> setQuickCustomerOpen(!quickCustomerPanel.classList.contains("open")));
  const quickCustomerCancel = document.getElementById("cancelRxQuickCustomer");
  if(quickCustomerCancel) quickCustomerCancel.addEventListener("click", ()=> setQuickCustomerOpen(false));
  const quickPhoneInput = document.getElementById("f_rxq_telefon");
  quickPhoneInput.addEventListener("input", e=>{ e.target.value = formatPhoneMask(e.target.value); });
  const saveQuickCustomer = ()=>{
    const ad = document.getElementById("f_rxq_ad").value.trim();
    const soyad = document.getElementById("f_rxq_soyad").value.trim();
    const telefon = quickPhoneInput.value.trim();
    const emailInput = document.getElementById("f_rxq_email");
    const email = emailInput.value.trim();
    if(!ad || !soyad || !telefon){ showToast("Ad, soyad ve telefon zorunludur.","error"); return; }
    if(email && !emailInput.checkValidity()){ showToast("Geçerli bir e-posta adresi girin.","error"); return; }
    const phoneDigits = telefon.replace(/\D/g,"");
    const existing = DB.customers.find(c=>(c.telefon||"").replace(/\D/g,"")===phoneDigits);
    if(existing){
      document.getElementById("f_rx_customer").value = existing.id;
      setQuickCustomerOpen(false);
      showToast("Bu telefonla kayıtlı müşteri seçildi.","success");
      return;
    }
    const customer = {
      id:uid("cus"), ad, soyad, telefon, email,
      tc:"", dogumTarihi:"", cinsiyet:"", adres:"", notlar:"",
      etiketler:["Yeni"], olusturma:new Date().toISOString()
    };
    DB.customers.push(customer);
    saveDB();
    const select = document.getElementById("f_rx_customer");
    select.innerHTML = '<option value="">Müşteri seçin…</option>' + DB.customers.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(c=>`<option value="${c.id}">${escapeHTML(customerFullName(c))}</option>`).join("");
    select.value = customer.id;
    setQuickCustomerOpen(false);
    showToast(`${customerFullName(customer)} oluşturuldu ve seçildi.`,"success");
    document.getElementById("f_rx_tarih").focus();
  };
  document.getElementById("saveRxQuickCustomer").addEventListener("click", saveQuickCustomer);
  quickCustomerPanel.querySelectorAll("input").forEach(input=>input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); saveQuickCustomer(); }
  }));
  if(DB.customers.length===0) setTimeout(()=>document.getElementById("f_rxq_ad").focus(), 160);
  document.querySelectorAll("#rxTypeChips .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      document.querySelectorAll("#rxTypeChips .chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      selectedType = chip.dataset.type;
    });
  });

  function currentEyeVals(){
    return {
      od:{sph:document.getElementById("f_od_sph").value, cyl:document.getElementById("f_od_cyl").value, axis:document.getElementById("f_od_axis").value, add:document.getElementById("f_od_add").value},
      os:{sph:document.getElementById("f_os_sph").value, cyl:document.getElementById("f_os_cyl").value, axis:document.getElementById("f_os_axis").value, add:document.getElementById("f_os_add").value}
    };
  }
  function refreshPreview(){
    const vals = currentEyeVals();
    document.getElementById("rxLivePreview").innerHTML = lensDiagramSVG(vals,240,110);
  }
  ["f_od_sph","f_od_cyl","f_od_axis","f_od_add","f_os_sph","f_os_cyl","f_os_axis","f_os_add"].forEach(id=>{
    document.getElementById(id).addEventListener("input", refreshPreview);
  });

  document.getElementById("saveRxBtn").addEventListener("click", ()=>{
    const customerId = document.getElementById("f_rx_customer").value;
    if(!customerId){ showToast("Lütfen bir müşteri seçin.","error"); return; }
    const eyes = currentEyeVals();
    const num = v => v===""?"":parseFloat(v);
    const payload = {
      customerId,
      tarih: document.getElementById("f_rx_tarih").value || todayISO(),
      doktor: document.getElementById("f_rx_doktor").value.trim(),
      tur: selectedType,
      od: {sph:num(eyes.od.sph), cyl:num(eyes.od.cyl), axis:num(eyes.od.axis)||0, add:num(eyes.od.add)},
      os: {sph:num(eyes.os.sph), cyl:num(eyes.os.cyl), axis:num(eyes.os.axis)||0, add:num(eyes.os.add)},
      pd: document.getElementById("f_rx_pd").value ? parseFloat(document.getElementById("f_rx_pd").value) : "",
      notlar: document.getElementById("f_rx_notlar").value.trim(),
    };
    if(isEdit){
      Object.assign(rx, payload);
      showToast("Reçete güncellendi.","success");
    } else {
      payload.id = uid("rx");
      DB.prescriptions.push(payload);
      showToast("Reçete eklendi.","success");
    }
    saveDB();
    closeModal();
    render();
  });
}

function deleteRx(id){
  confirmAction("Bu reçete kalıcı olarak silinecek.", ()=>{
    DB.prescriptions = DB.prescriptions.filter(r=>r.id!==id);
    saveDB();
    showToast("Reçete silindi.");
    render();
  });
}

}

   SALES
   ========================================================= */
let salesSearchQuery = "";
let salesStatusFilter = "all";
let salesSort = {key:"tarih", dir:"desc"};
let salesPage = 1;
const SALES_PER_PAGE = 10;

function salesSortAccessor(s,key){
  if(key==="musteri") return customerFullName(getCustomer(s.customerId));
  if(key==="tutar") return saleTotal(s);
  return s.tarih||"";
}

function renderSales(){
  let list = DB.sales.filter(s=>{
    if(salesSearchQuery){
      const q = salesSearchQuery.toLowerCase();
      if(!(customerFullName(getCustomer(s.customerId)).toLowerCase().includes(q) || (s.faturaNo||"").toLowerCase().includes(q))) return false;
    }
    if(salesStatusFilter!=="all" && saleStatus(s)!==salesStatusFilter) return false;
    return true;
  });
  list = sortRows(list, salesSort.key, salesSort.dir, salesSortAccessor);
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total/SALES_PER_PAGE));
  salesPage = Math.min(salesPage, totalPages);
  const pageItems = paginateSlice(list, salesPage, SALES_PER_PAGE);
  const totalRevenue = list.reduce((sum,s)=>sum+saleTotal(s),0);

  const th = (label,key) => `<th class="sortable ${salesSort.key===key?'sorted':''}" data-sort="${key}">${label}${sortArrow(key,salesSort)}</th>`;

  return `
    <div class="toolbar-row">
      <div class="toolbar-left">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="salesFilterInput" placeholder="Müşteri veya fatura no ara…" value="${escapeHTML(salesSearchQuery)}" style="width:220px;">
        </div>
        <div class="chip-select">
          ${[["all","Tümü"],["odendi","Ödendi"],["kismi","Kısmi"],["bekliyor","Bekliyor"]].map(([k,l])=>`<button type="button" class="chip ${salesStatusFilter===k?'active':''}" data-status-filter="${k}">${l}</button>`).join("")}
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" id="btnExportSalesCSV">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
          CSV
        </button>
        <button class="btn btn-primary" id="btnNewSale">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          Yeni Satış
        </button>
      </div>
    </div>
    <div class="card" style="padding:0;">
      ${total===0 ? emptyState("Satış bulunamadı","Filtreyi değiştirin ya da yeni bir satış ekleyin.") : `
      <div class="table-wrap"><table data-primary-col="2">
        <thead><tr><th>Fatura No</th>${th("Tarih","tarih")}${th("Müşteri","musteri")}<th>Ürünler</th><th class="text-right sortable ${salesSort.key==='tutar'?'sorted':''}" data-sort="tutar">Tutar${sortArrow('tutar',salesSort)}</th><th>Durum</th><th></th></tr></thead>
        <tbody>
          ${pageItems.map(s=>`
            <tr>
              <td class="cell-mono" style="font-size:11.5px;color:var(--ink-faint);">${escapeHTML(s.faturaNo||"—")}</td>
              <td class="cell-muted">${fmtDate(s.tarih)}</td>
              <td class="cell-strong" style="cursor:pointer;" data-open-customer="${s.customerId}">${escapeHTML(customerFullName(getCustomer(s.customerId)))}</td>
              <td class="cell-muted" style="max-width:220px;">${(s.items||[]).map(i=>escapeHTML(i.ad)).join(", ")}</td>
              <td class="cell-mono text-right">${fmtCurrency(saleTotal(s))}</td>
              <td>${saleStatusBadge(s)}</td>
              <td>
                <div class="row-actions">
                  <button class="btn-icon" data-print-sale="${s.id}" title="Fatura / Fiş"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg></button>
                  <button class="btn-icon" data-edit-sale-g="${s.id}" title="Düzenle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                  <button class="btn-icon" data-delete-sale-g="${s.id}" title="Sil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table></div>
      ${paginationBar(total, salesPage, SALES_PER_PAGE, "sales")}`}
    </div>
    ${total>0 ? `<div style="text-align:right;margin-top:10px;font-size:12.5px;color:var(--ink-soft);">Listelenen toplam: <strong class="cell-mono">${fmtCurrency(totalRevenue)}</strong></div>` : ""}
  `;
}

function exportSalesCSV(){
  const headers = ["Fatura No","Tarih","Müşteri","Ürünler","Ara Toplam","KDV","Genel Toplam","Ödenen","Durum","Ödeme Yöntemi"];
  const rows = DB.sales.map(s=>{
    const t = taxBreakdown(saleTotal(s), s.kdvOrani);
    return [
      s.faturaNo, s.tarih, customerFullName(getCustomer(s.customerId)),
      (s.items||[]).map(i=>i.ad).join(" / "),
      t.araToplam.toFixed(2), t.kdv.toFixed(2), t.genelToplam.toFixed(2),
      s.odenen, saleStatus(s), s.odemeYontemi
    ];
  });
  downloadCSV("netlik-satislar-"+todayISO()+".csv", headers, rows);
}

        <div class="invoice-totals-row"><span>Ara Toplam</span><span class="cell-mono" id="saleSubtotalDisplay">${fmtCurrency(0)}</span></div>
        <div class="invoice-totals-row"><span>KDV</span><span class="cell-mono" id="saleVatDisplay">${fmtCurrency(0)}</span></div>
        <div class="invoice-totals-row grand"><span>Genel Toplam</span><span class="cell-mono" id="saleTotalDisplay">${fmtCurrency(0)}</span></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" id="saveSaleBtn">${isEdit?"Kaydet":"Satışı Kaydet"}</button>
    </div>
  `, {wide:true});

  bindModalClose();

  function productOptionsHTML(selectedName){
    return `<option value="">Manuel giriş / stok dışı</option>` + DB.products.map(p=>{
      const label = `${p.marka} ${p.model}${p.renk&&p.renk!=='—'?' ('+p.renk+')':''}`;
      return `<option value="${p.id}" ${label===selectedName?"selected":""}>${escapeHTML(label)} — ${fmtCurrency(p.fiyat)} · stok:${p.stok}</option>`;
    }).join("");
  }

  function renderItemRows(){
    const wrap = document.getElementById("saleItemsWrap");
    wrap.innerHTML = saleFormItems.map((it,idx)=>`
      <div class="form-row-4 sale-item-row" style="align-items:end;margin-bottom:8px;" data-item-row="${idx}">
        <div class="field" style="margin-bottom:0;"><label>Tür</label>
          <select data-item-field="tur" data-idx="${idx}">
            ${PRODUCT_CATEGORIES.map(c=>`<option ${it.tur===c?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;grid-column:span 2;"><label>Ürün</label>
          <select data-item-field="product" data-idx="${idx}">${productOptionsHTML(it.ad)}</select>
          <input type="text" data-item-field="ad" data-idx="${idx}" value="${escapeHTML(it.ad)}" placeholder="Ürün adı" style="margin-top:6px;">
        </div>
        <div class="field" style="margin-bottom:0;"><label>Adet × Fiyat</label>
          <div style="display:flex;gap:6px;">
            <input type="number" min="1" data-item-field="adet" data-idx="${idx}" value="${it.adet}" style="width:60px;">
            <input type="number" min="0" data-item-field="birimFiyat" data-idx="${idx}" value="${it.birimFiyat}">
            <button class="btn-icon" data-remove-item="${idx}" title="Satırı Sil" type="button" ${saleFormItems.length===1?'disabled':''}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
      </div>
    `).join("");

    wrap.querySelectorAll("[data-item-field='product']").forEach(sel=>{
      sel.addEventListener("change",(e)=>{
        const idx = Number(e.target.dataset.idx);
        const prod = DB.products.find(p=>p.id===e.target.value);
        if(prod){
          saleFormItems[idx].ad = `${prod.marka} ${prod.model}${prod.renk&&prod.renk!=='—'?' ('+prod.renk+')':''}`;
          saleFormItems[idx].tur = prod.kategori;
          saleFormItems[idx].birimFiyat = prod.fiyat;
          saleFormItems[idx].productId = prod.id;
        } else {
          saleFormItems[idx].productId = null;
        }
        renderItemRows();
        updateTotal();
      });
    });
    wrap.querySelectorAll("[data-item-field='tur']").forEach(sel=> sel.addEventListener("change",(e)=>{ saleFormItems[Number(e.target.dataset.idx)].tur = e.target.value; }));
    wrap.querySelectorAll("[data-item-field='ad']").forEach(inp=> inp.addEventListener("input",(e)=>{ saleFormItems[Number(e.target.dataset.idx)].ad = e.target.value; }));
    wrap.querySelectorAll("[data-item-field='adet']").forEach(inp=> inp.addEventListener("input",(e)=>{ saleFormItems[Number(e.target.dataset.idx)].adet = parseFloat(e.target.value)||0; updateTotal(); }));
    wrap.querySelectorAll("[data-item-field='birimFiyat']").forEach(inp=> inp.addEventListener("input",(e)=>{ saleFormItems[Number(e.target.dataset.idx)].birimFiyat = parseFloat(e.target.value)||0; updateTotal(); }));
    wrap.querySelectorAll("[data-remove-item]").forEach(b=> b.addEventListener("click",(e)=>{
      saleFormItems.splice(Number(e.currentTarget.dataset.removeItem),1);
      renderItemRows();
      updateTotal();
    }));
  }

  function updateTotal(){
    const total = saleFormItems.reduce((sum,it)=> sum + (Number(it.adet)||0)*(Number(it.birimFiyat)||0), 0);
    const rate = Number(document.getElementById("f_sale_kdv").value)||0;
    const t = taxBreakdown(total, rate);
    document.getElementById("saleSubtotalDisplay").textContent = fmtCurrency(t.araToplam);
    document.getElementById("saleVatDisplay").textContent = fmtCurrency(t.kdv);
    document.getElementById("saleTotalDisplay").textContent = fmtCurrency(t.genelToplam);
  }

  renderItemRows();
  updateTotal();
  document.getElementById("f_sale_kdv").addEventListener("change", updateTotal);

  document.getElementById("addSaleItemBtn").addEventListener("click", ()=>{
    saleFormItems.push({tur:"Çerçeve", ad:"", adet:1, birimFiyat:0});
    renderItemRows();
    updateTotal();
  });

  document.getElementById("saveSaleBtn").addEventListener("click", ()=>{
    const customerId = document.getElementById("f_sale_customer").value;
    if(!customerId){ showToast("Lütfen bir müşteri seçin.","error"); return; }
    const validItems = saleFormItems.filter(it=> it.ad && it.ad.trim() && Number(it.adet)>0);
    if(validItems.length===0){ showToast("En az bir geçerli ürün satırı ekleyin.","error"); return; }

    // Adjust stock: restore old (if editing) then deduct new
    if(isEdit){
      (sale.items||[]).forEach(it=>{
        if(it.productId){ const p = DB.products.find(p=>p.id===it.productId); if(p) p.stok = (Number(p.stok)||0) + (Number(it.adet)||0); }
      });
    }
    validItems.forEach(it=>{
      if(it.productId){ const p = DB.products.find(p=>p.id===it.productId); if(p) p.stok = Math.max(0,(Number(p.stok)||0) - (Number(it.adet)||0)); }
    });

    const payload = {
      customerId,
      tarih: document.getElementById("f_sale_tarih").value || todayISO(),
      items: validItems,
      odenen: parseFloat(document.getElementById("f_sale_odenen").value)||0,
      odemeYontemi: document.getElementById("f_sale_yontem").value,
      kdvOrani: Number(document.getElementById("f_sale_kdv").value)||0,
      notlar: document.getElementById("f_sale_notlar").value.trim(),
    };
    let savedSale;
    if(isEdit){
      Object.assign(sale, payload);
      savedSale = sale;
      showToast("Satış güncellendi.","success");
    } else {
      payload.id = uid("sal");
      payload.faturaNo = nextInvoiceNumber();
      DB.sales.push(payload);
      savedSale = payload;
      showToast("Satış kaydedildi.","success");
    }
    saveDB();
    closeModal();
    render();
    if(!isEdit) openInvoicePreview(savedSale);
  });
}

function deleteSale(id){
  confirmAction("Bu satış kaydı silinecek. Stoktan düşülen ürünler geri eklenmeyecektir.", ()=>{
    DB.sales = DB.sales.filter(s=>s.id!==id);
    saveDB();
    showToast("Satış silindi.");
    render();
  });
}

      <div class="invoice-totals">

        <div class="invoice-totals-row"><span>KDV (%${sale.kdvOrani||0})</span><span class="cell-mono">${fmtCurrency(t.kdv)}</span></div>
        <div class="invoice-totals-row grand"><span>Genel Toplam</span><span class="cell-mono">${fmtCurrency(t.genelToplam)}</span></div>
        <div class="invoice-totals-row"><span>Ödenen (${escapeHTML(sale.odemeYontemi||"—")})</span><span class="cell-mono">${fmtCurrency(sale.odenen)}</span></div>
        ${kalan>0.5 ? `<div class="invoice-totals-row" style="color:var(--danger);font-weight:700;"><span>Kalan</span><span class="cell-mono">${fmtCurrency(kalan)}</span></div>` : ""}
      </div>
      ${s.fisNotu ? `<div class="invoice-footer-note">${escapeHTML(s.fisNotu)}</div>` : ""}

  let currentPaper = "a5";

    <div class="modal-body">

/* =========================================================
   INVENTORY
   ========================================================= */
let inventorySearchQuery = "";
let inventoryCategoryFilter = "all";

let inventorySort = {key:"marka", dir:"asc"};
let inventoryPage = 1;
const INVENTORY_PER_PAGE = 10;

function inventorySortAccessor(p,key){
  if(key==="marka") return p.marka+" "+p.model;
  if(key==="fiyat") return Number(p.fiyat)||0;
  if(key==="stok") return Number(p.stok)||0;
  return p.kategori;
}

function renderInventory(){
  let list = DB.products.filter(p=>{
    if(inventorySearchQuery){
      const q = inventorySearchQuery.toLowerCase();
      if(!((p.marka+" "+p.model+" "+(p.sku||"")).toLowerCase().includes(q))) return false;
    }
    if(inventoryCategoryFilter!=="all" && p.kategori!==inventoryCategoryFilter) return false;
    return true;
  });
  list = sortRows(list, inventorySort.key, inventorySort.dir, inventorySortAccessor);
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total/INVENTORY_PER_PAGE));
  inventoryPage = Math.min(inventoryPage, totalPages);
  const pageItems = paginateSlice(list, inventoryPage, INVENTORY_PER_PAGE);

  const totalValue = DB.products.reduce((sum,p)=> sum + (Number(p.fiyat)||0)*(Number(p.stok)||0), 0);
  const lowCount = DB.products.filter(p=>(Number(p.stok)||0)<=3).length;
  const th = (label,key) => `<th class="sortable ${inventorySort.key===key?'sorted':''}" data-sort="${key}">${label}${sortArrow(key,inventorySort)}</th>`;

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Toplam Ürün Çeşidi</div><div class="stat-value">${DB.products.length}</div></div>
      <div class="stat-card"><div class="stat-label">Toplam Adet</div><div class="stat-value">${DB.products.reduce((s,p)=>s+(Number(p.stok)||0),0)}</div></div>
      <div class="stat-card"><div class="stat-label">Stok Değeri</div><div class="stat-value" style="font-size:19px;">${fmtCurrency(totalValue)}</div></div>
      <div class="stat-card"><div class="stat-label">Kritik Stok</div><div class="stat-value" style="color:${lowCount>0?'var(--danger)':'inherit'};">${lowCount}</div></div>
    </div>

    <div class="toolbar-row">
      <div class="toolbar-left">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="invFilterInput" placeholder="Marka, model veya SKU ara…" value="${escapeHTML(inventorySearchQuery)}" style="width:230px;">
        </div>
        <div class="chip-select">
          <button type="button" class="chip ${inventoryCategoryFilter==='all'?'active':''}" data-cat-filter="all">Tümü</button>
          ${PRODUCT_CATEGORIES.map(c=>`<button type="button" class="chip ${inventoryCategoryFilter===c?'active':''}" data-cat-filter="${c}">${c}</button>`).join("")}
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" id="btnExportInventoryCSV">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
          CSV
        </button>
        <button class="btn btn-primary" id="btnNewProduct">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          Yeni Ürün
        </button>
      </div>
    </div>

    <div class="card" style="padding:0;">
      ${total===0 ? emptyState("Ürün bulunamadı","Filtreyi değiştirin ya da yeni ürün ekleyin.") : `
      <div class="table-wrap"><table data-primary-col="1">
        <thead><tr><th>Kategori</th>${th("Marka / Model","marka")}<th>Renk</th>${th("Fiyat","fiyat")}${th("Stok","stok")}<th>SKU</th><th></th></tr></thead>
        <tbody>
          ${pageItems.map(p=>{
            const low = (Number(p.stok)||0)<=3;
            return `
            <tr>
              <td><span class="badge badge-neutral">${escapeHTML(p.kategori)}</span></td>
              <td class="cell-strong">${escapeHTML(p.marka)} ${escapeHTML(p.model)}</td>
              <td class="cell-muted">${escapeHTML(p.renk||"—")}</td>
              <td class="cell-mono text-right">${fmtCurrency(p.fiyat)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button class="btn-icon" data-stock-adj="${p.id}" data-delta="-1" title="Azalt">−</button>
                  <span class="cell-mono" style="min-width:20px;text-align:center;${low?'color:var(--danger);font-weight:700;':''}">${p.stok}</span>
                  <button class="btn-icon" data-stock-adj="${p.id}" data-delta="1" title="Artır">+</button>
                </div>
              </td>
              <td class="cell-mono" style="font-size:11.5px;color:var(--ink-faint);">${escapeHTML(p.sku||"—")}</td>
              <td>
                <div class="row-actions">
                  <button class="btn-icon" data-edit-product="${p.id}" title="Düzenle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                  <button class="btn-icon" data-delete-product="${p.id}" title="Sil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
                </div>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
      ${paginationBar(total, inventoryPage, INVENTORY_PER_PAGE, "inventory")}`}
    </div>
  `;
}

function exportInventoryCSV(){
  const headers = ["Kategori","Marka","Model","Renk","Fiyat","Stok","SKU"];
  const rows = DB.products.map(p=>[p.kategori,p.marka,p.model,p.renk,p.fiyat,p.stok,p.sku]);
  downloadCSV("netlik-stok-"+todayISO()+".csv", headers, rows);
}

        <div class="field"><label>Stok Adedi *</label><input type="number" min="0" id="f_p_stok" value="${data.stok}"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" id="saveProductBtn">${isEdit?"Kaydet":"Ürünü Ekle"}</button>
    </div>
  `);
  bindModalClose();
  document.getElementById("saveProductBtn").addEventListener("click", ()=>{
    const marka = document.getElementById("f_p_marka").value.trim();
    const model = document.getElementById("f_p_model").value.trim();
    if(!marka || !model){ showToast("Marka ve model zorunludur.","error"); return; }
    const payload = {
      kategori: document.getElementById("f_p_kategori").value,
      marka, model,
      renk: document.getElementById("f_p_renk").value.trim() || "—",
      sku: document.getElementById("f_p_sku").value.trim(),
      fiyat: parseFloat(document.getElementById("f_p_fiyat").value)||0,
      stok: parseInt(document.getElementById("f_p_stok").value)||0,
    };
    if(isEdit){
      Object.assign(p, payload);
      showToast("Ürün güncellendi.","success");
    } else {
      payload.id = uid("prd");
      DB.products.push(payload);
      showToast("Ürün eklendi.","success");
    }
    saveDB();
    closeModal();
    render();
  });
}

    DB.products = DB.products.filter(p=>p.id!==id);
    saveDB();
    showToast("Ürün silindi.");
    render();

function mountInventory(){
  const input = document.getElementById("invFilterInput");
  bindFilterInput(input, (value)=>{ inventorySearchQuery = value; inventoryPage = 1; });
  document.querySelectorAll("[data-cat-filter]").forEach(b=> b.addEventListener("click", ()=>{ inventoryCategoryFilter = b.dataset.catFilter; render(); }));
  document.getElementById("btnNewProduct").addEventListener("click", ()=> openProductForm(null));
  document.querySelectorAll("[data-edit-product]").forEach(b=> b.addEventListener("click", ()=> openProductForm(DB.products.find(p=>p.id===b.dataset.editProduct))));
  document.querySelectorAll("[data-delete-product]").forEach(b=> b.addEventListener("click", ()=> deleteProduct(b.dataset.deleteProduct)));
  document.querySelectorAll("[data-stock-adj]").forEach(b=> b.addEventListener("click", ()=>{
    const p = DB.products.find(p=>p.id===b.dataset.stockAdj);
    if(!p) return;
    p.stok = Math.max(0, (Number(p.stok)||0) + Number(b.dataset.delta));
    saveDB();
    render();
  }));
}

/* =========================================================
   REPORTS
   ========================================================= */
function renderReports(){
  const statusCounts = {odendi:0, kismi:0, bekliyor:0};
  DB.sales.forEach(s=> statusCounts[saleStatus(s)]++);
  const statusTotal = DB.sales.length || 1;

  const catTotals = {};
  DB.sales.forEach(s=> (s.items||[]).forEach(it=>{
    const key = it.tur || "Diğer";
    catTotals[key] = (catTotals[key]||0) + (Number(it.adet)||0)*(Number(it.birimFiyat)||0);
  }));
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catMax = Math.max(...catEntries.map(e=>e[1]), 1);

  const topCustomers = DB.customers
    .map(c=>({c, total: customerTotalSpend(c.id)}))
    .filter(x=>x.total>0)
    .sort((a,b)=> b.total-a.total)
    .slice(0,5);
  const topMax = Math.max(...topCustomers.map(x=>x.total), 1);

  const donutColors = {odendi:"var(--success)", kismi:"var(--amber)", bekliyor:"var(--danger)"};
  let gradParts = [];
  let acc = 0;
  [["odendi",statusCounts.odendi],["kismi",statusCounts.kismi],["bekliyor",statusCounts.bekliyor]].forEach(([k,v])=>{
    const pct = v/statusTotal*100;
    gradParts.push(`${donutColors[k]} ${acc}% ${acc+pct}%`);
    acc += pct;
  });
  const gradient = gradParts.length ? `conic-gradient(${gradParts.join(",")})` : "var(--mist)";

  return `
    <div class="grid grid-3" style="align-items:start;">
      <div class="card">
        <div class="card-head"><div><div class="card-title">Son 12 Ay Ciro</div><p>Aylık toplam satış tutarı</p></div></div>
        ${monthlyRevenueChart(12)}
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">Ödeme Durumu</div><p>${DB.sales.length} satış</p></div></div>
        <div class="donut-wrap">
          <div style="width:120px;height:120px;border-radius:50%;background:${gradient};flex-shrink:0;"></div>
          <div class="legend-list">
            <div class="legend-item"><span class="legend-swatch" style="background:var(--success);"></span>Ödendi — ${statusCounts.odendi}</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--amber);"></span>Kısmi — ${statusCounts.kismi}</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--danger);"></span>Bekliyor — ${statusCounts.bekliyor}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-3" style="margin-top:16px;align-items:start;">
      <div class="card">
        <div class="card-head"><div><div class="card-title">Kategoriye Göre Ciro</div><p>Ürün türü bazında toplam satış</p></div></div>
        ${catEntries.length===0 ? emptyState("Henüz veri yok","") : catEntries.map(([k,v])=>`
          <div class="hbar-row">
            <div class="hbar-label">${escapeHTML(k)}</div>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(v/catMax*100).toFixed(1)}%;"></div></div>
            <div class="hbar-val">${fmtCurrency(v)}</div>
          </div>
        `).join("")}
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">En Değerli Müşteriler</div><p>Toplam harcamaya göre</p></div></div>
        ${topCustomers.length===0 ? emptyState("Henüz veri yok","") : topCustomers.map(x=>`
          <div class="hbar-row">
            <button type="button" class="hbar-label hbar-label-btn" data-open-customer="${x.c.id}">${escapeHTML(customerFullName(x.c))}</button>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(x.total/topMax*100).toFixed(1)}%;background:var(--amber);"></div></div>
            <div class="hbar-val">${fmtCurrency(x.total)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

}
