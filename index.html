function mountSettings(){
  document.querySelectorAll("[data-settings-tab]").forEach(b=> b.addEventListener("click", ()=>{
    settingsTab = b.dataset.settingsTab;
    render();
  }));

  const logoInput = document.getElementById("logoUploadInput");
  if(logoInput) logoInput.addEventListener("change",(e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 1.5*1024*1024){ showToast("Logo dosyası çok büyük (max 1.5MB).","error"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      DB.settings.logo = reader.result;
      saveDB();
      showToast("Logo güncellendi.","success");
      render();
    };
    reader.readAsDataURL(file);
  });
  const removeLogoBtn = document.getElementById("removeLogoBtn");
  if(removeLogoBtn) removeLogoBtn.addEventListener("click", ()=>{
    DB.settings.logo = "";
    saveDB();
    render();
  });

  const saveMagazaBtn = document.getElementById("saveMagazaBtn");
  if(saveMagazaBtn) saveMagazaBtn.addEventListener("click", ()=>{
    DB.settings.magazaAdi = document.getElementById("f_s_ad").value.trim() || "Mağazam";
    DB.settings.telefon = document.getElementById("f_s_tel").value.trim();
    DB.settings.vergiDairesi = document.getElementById("f_s_vd").value.trim();
    DB.settings.vergiNo = document.getElementById("f_s_vn").value.trim();
    DB.settings.adres = document.getElementById("f_s_adres").value.trim();
    saveDB();
    showToast("Mağaza bilgileri güncellendi.","success");
    render();
  });

  const saveFaturaBtn = document.getElementById("saveFaturaBtn");
  if(saveFaturaBtn) saveFaturaBtn.addEventListener("click", ()=>{
    DB.settings.kdvOrani = Number(document.getElementById("f_s_kdv").value)||0;
    DB.settings.faturaOnEk = document.getElementById("f_s_onek").value.trim() || "NTL-";
    DB.settings.fisNotu = document.getElementById("f_s_not").value.trim();
    saveDB();
    showToast("Fatura ayarları güncellendi.","success");
    render();
  });

  const exportBtn = document.getElementById("btnExportSettings");
  if(exportBtn) exportBtn.addEventListener("click", exportBackupJSON);
  const importInput = document.getElementById("fileImportSettings");
  if(importInput) importInput.addEventListener("change",(e)=>{
    importBackupFile(e.target.files[0]);
    e.target.value = "";
  });
  const resetBtn = document.getElementById("btnResetSettings");
  if(resetBtn) resetBtn.addEventListener("click", resetAllData);
}

init();

/* The app stays hidden behind `body.firebase-pending` until firebase-sync.js puts up
   the PIN gate. That module depends on three cross-origin ESM imports, so a blocked or
   unreachable CDN used to leave nothing but a blank screen. Show an explicit, retryable
   error instead — and keep the data hidden, since the PIN gate never ran. */
const GATE_FAILSAFE_MS = 8000;
window.__kanerGateFailsafe = setTimeout(()=>{
  if(document.getElementById("firebaseGate")) return;
  const fallback = document.createElement("div");
  fallback.className = "firebase-gate";
  fallback.id = "firebaseGateFallback";
  fallback.innerHTML = `
    <main class="firebase-gate-card">
      <h1>Bağlantı kurulamadı</h1>
      <p class="firebase-gate-copy">Güvenli oturum bileşenleri yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin. Verileriniz bu cihazda korunuyor.</p>
      <button class="btn btn-primary firebase-gate-submit" type="button" id="gateRetryBtn">Yeniden dene</button>
    </main>`;
  document.body.appendChild(fallback);
  document.getElementById("gateRetryBtn").addEventListener("click", ()=> location.reload());
}, GATE_FAILSAFE_MS);

window.KanerApp = {
  snapshot(){ return JSON.parse(JSON.stringify(DB)); },
  applyCloud(nextDB){
    window.__KANER_CLOUD_APPLYING__ = true;
    DB = migrateDB(nextDB);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    updateNavCounts();
    updateSidebarBrand();
    refreshBellBadge();
    render();
    window.__KANER_CLOUD_APPLYING__ = false;
  },
  toast(message, type){ showToast(message, type); }
};
